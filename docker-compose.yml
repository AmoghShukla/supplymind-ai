services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: supplymind, POSTGRES_USER: supplymind, POSTGRES_PASSWORD: supplymind }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U supplymind -d supplymind"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    env_file: .env
    command: python -m app.events.consumer
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
